name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check && deno task test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/usage.p12"
      - name: Build and lint
        working-directory: android
        env:
          SIGNING_STORE: ${{ runner.temp }}/usage.p12
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: archea-usage-android
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  android-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install test-apks/debug/app-debug.apk
            adb install test-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w dev.archea.usage.test/android.test.InstrumentationTestRunner | tee instrumentation.txt
            grep -q 'OK (' instrumentation.txt
